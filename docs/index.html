<body>
<title>Cauldron Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Creepster&display=swap">
<style>
/* Layout: a night-time pumpkin patch. Sticky header, tab rail, then one working view.
   The daily view is a row of "door" tiles (one per day) above a lantern-lit day card. */
:root {
  --bg: #140f1c;
  --surface: #1e1729;
  --surface-2: #2a2037;
  --line: #3b2f4b;
  --fg: #f1eaf7;
  --muted: #b3a5c5;
  --pumpkin: #ff8a2a;
  --pumpkin-ink: #1d0f04;
  --pumpkin-soft: rgba(255, 138, 42, .14);
  --candle: #ffd36b;
  --moss: #7fd18b;
  --blood: #ff7070;
  --violet: #b48cff;
  --violet-soft: rgba(180, 140, 255, .14);
  --glow: radial-gradient(1200px 500px at 85% -10%, rgba(255,138,42,.16), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(180,140,255,.12), transparent 60%);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --display: "Creepster", "Impact", "Haettenschweiler", fantasy;
  --body: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f1f8; --surface: #ffffff; --surface-2: #f0e8f5; --line: #e0d3ea; --fg: #261a32; --muted: #6c5d7e;
    --pumpkin: #c9560a; --pumpkin-ink: #ffffff; --pumpkin-soft: rgba(201, 86, 10, .10); --candle: #9a6a06;
    --moss: #2c8442; --blood: #c23a3a; --violet: #6f45c7; --violet-soft: rgba(111, 69, 199, .10);
    --glow: radial-gradient(1200px 500px at 85% -10%, rgba(255,138,42,.12), transparent 60%);
    --shadow: 0 8px 24px rgba(60, 30, 80, .10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f1f8; --surface: #ffffff; --surface-2: #f0e8f5; --line: #e0d3ea; --fg: #261a32; --muted: #6c5d7e;
  --pumpkin: #c9560a; --pumpkin-ink: #ffffff; --pumpkin-soft: rgba(201, 86, 10, .10); --candle: #9a6a06;
  --moss: #2c8442; --blood: #c23a3a; --violet: #6f45c7; --violet-soft: rgba(111, 69, 199, .10);
  --glow: radial-gradient(1200px 500px at 85% -10%, rgba(255,138,42,.12), transparent 60%);
  --shadow: 0 8px 24px rgba(60, 30, 80, .10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--glow), var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pumpkin); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--pumpkin); letter-spacing: .02em; line-height: 1; }
.brand span { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { border-color: color-mix(in srgb, var(--moss) 50%, var(--line)); }
.pill.over { border-color: var(--blood); color: var(--blood); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--moss); display: inline-block; }
.dot.warn { background: var(--candle); } .dot.bad { background: var(--blood); }

.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); background: var(--surface); }
.tab[aria-selected="true"] { color: var(--pumpkin-ink); background: var(--pumpkin); }

main { padding-block: 20px 80px; display: grid; gap: 20px; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.panel h2 { font-size: 20px; font-weight: 750; }
.sub { color: var(--muted); font-size: 13px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--pumpkin); }
.btn.primary { background: var(--pumpkin); color: var(--pumpkin-ink); border-color: var(--pumpkin); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.btn.on { border-color: var(--violet); color: var(--violet); background: var(--violet-soft); }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.spooky { color: var(--pumpkin); border-color: color-mix(in srgb, var(--pumpkin) 40%, var(--line)); background: var(--pumpkin-soft); }
.chip.ai { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 40%, var(--line)); background: var(--violet-soft); }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 14px; user-select: none; }
.toggle input { accent-color: var(--pumpkin); margin: 0; }
.toggle:has(input:checked) { border-color: var(--pumpkin); background: var(--pumpkin-soft); }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { font-size: 15px; color: var(--fg); }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--fg); min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 64px; }
.num { font-variant-numeric: tabular-nums; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--pumpkin); background: var(--pumpkin-soft); font-size: 14px; }
.banner p { margin: 0; flex: 1 1 260px; }

/* day doors */
.doors { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(74px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.door { border: 1px solid var(--line); background: var(--surface); border-radius: 14px 14px 10px 10px; padding: 8px 6px 10px; cursor: pointer; display: grid; justify-items: center; gap: 2px; position: relative; }
.door .n { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--muted); }
.door .wd { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.door .dt { font-size: 11px; color: var(--muted); }
.door .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; }
.door.today { border-color: var(--candle); }
.door[aria-current="true"] { background: var(--pumpkin); border-color: var(--pumpkin); color: var(--pumpkin-ink); box-shadow: 0 6px 22px var(--pumpkin-soft); }
.door[aria-current="true"] .n, .door[aria-current="true"] .dt { color: var(--pumpkin-ink); }

/* day card */
.daycard { display: grid; grid-template-columns: auto 1fr; gap: 18px 24px; align-items: center; }
.bignum { font-family: var(--display); font-size: clamp(64px, 14vw, 112px); line-height: .85; color: var(--pumpkin); text-shadow: 0 0 30px var(--pumpkin-soft); }
.daycard h2 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; grid-column: 1 / -1; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--moss); border-radius: 6px; }
.meter i.warn { background: var(--candle); } .meter i.bad { background: var(--blood); }
.people { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; }
.person { font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); }
.person b { font-weight: 700; }

.meals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.meal.locked { border-color: var(--violet); }
.meal .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.meal .emoji { font-size: 34px; line-height: 1; }
.meal h3 { font-size: 17px; font-weight: 700; cursor: pointer; }
.meal h3:hover { color: var(--pumpkin); }
.meal .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.meal .portions { font-size: 12px; color: var(--muted); display: grid; gap: 2px; border-top: 1px dashed var(--line); padding-top: 8px; }
.eat { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 8px; width: calc(100% + 8px); padding: 3px 4px; margin: 0 -4px; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
.eat:hover { background: var(--surface-2); color: var(--fg); }
.eat:focus-visible { outline: 2px solid var(--pumpkin); }
.eat.off span { text-decoration: line-through; opacity: .6; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; box-shadow: var(--shadow); padding: 12px 18px; border-radius: 999px; font-size: 15px; }
.stepper { display: flex; gap: 4px; align-items: center; }
.stepper input { text-align: center; }
.stepper .btn { padding: 7px 11px; }
.member .wide { grid-column: 1 / -1; }
.pick { display: flex; gap: 10px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; border-radius: 10px; }
.pick.cur { background: var(--pumpkin-soft); }
.pick .e { font-size: 28px; line-height: 1; }
.pick .grow { flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; }
.pick .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.heart { all: unset; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 6px 8px; border-radius: 8px; }
.heart.on { color: var(--blood); }
.heart:focus-visible { outline: 2px solid var(--pumpkin); }
.sheetfoot { position: sticky; bottom: -20px; z-index: 1; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 -20px -20px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
.mbody .panel { padding: 14px; }
.meal .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; }

/* week table */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
td.daycell { white-space: nowrap; font-weight: 700; }
td .m { cursor: pointer; } td .m:hover { color: var(--pumpkin); }
tr.cur td { background: var(--pumpkin-soft); }

/* groceries */
.storebars { display: grid; gap: 10px; }
.sb { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.sb .track { height: 14px; border-radius: 7px; background: var(--surface-2); position: relative; }
.sb .track i { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--violet); opacity: .75; }
.sb.best .track i { background: var(--moss); opacity: 1; }
.sb .track .budget { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--candle); }
.sb .amt { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 70px; text-align: right; }
.aisles { columns: 2 300px; column-gap: 20px; }
.aisle { break-inside: avoid; margin-bottom: 16px; }
.aisle h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--pumpkin); margin-bottom: 6px; }
.item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.item input { accent-color: var(--moss); width: 18px; height: 18px; margin: 0; flex: none; }
.item .q { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item.done .nm { text-decoration: line-through; color: var(--muted); }

/* recipes */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.rcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.rcard:hover { border-color: var(--pumpkin); }
.rcard .t { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.rcard .t span:first-child { font-size: 24px; }
.rcard .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.rcard.dim { opacity: .55; }

/* setup */
.setup { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.member { display: grid; grid-template-columns: 1fr 170px auto; gap: 8px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.calc { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; background: var(--surface-2); padding: 12px; border-radius: 12px; align-items: end; }
.stores { display: grid; gap: 6px; }
.store { display: grid; grid-template-columns: auto 1fr 84px; gap: 10px; align-items: center; font-size: 14px; }
.store input[type=checkbox] { accent-color: var(--pumpkin); width: 18px; height: 18px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.stack { display: grid; gap: 12px; }

/* conjure */
.conjure { border-color: color-mix(in srgb, var(--violet) 45%, var(--line)); background: linear-gradient(160deg, var(--violet-soft), transparent 60%), var(--surface); }
.conjure h2 { color: var(--violet); }
.cgrid { display: grid; grid-template-columns: 160px 1fr auto; gap: 10px; align-items: end; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* modal */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 5, 15, .6); backdrop-filter: blur(3px); }
.mbody { padding: 20px; display: grid; gap: 14px; overflow-y: auto; max-height: calc(100dvh - 42px); }
.mhead { display: flex; gap: 12px; align-items: flex-start; }
.mhead .e { font-size: 44px; line-height: 1; }
.mhead h2 { font-size: 22px; font-weight: 800; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.macros div { background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; color: var(--muted); }
.macros b { display: block; font-size: 17px; color: var(--fg); font-variant-numeric: tabular-nums; }
.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.ing li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.ing li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; transition: .25s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 560px) {
  .daycard { gap: 14px 16px; }
  .bignum { font-size: 64px; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .stat { padding: 8px; }
  .stat b { font-size: 16px; }
  .cgrid { grid-template-columns: 1fr; }
  .member { grid-template-columns: 1fr 150px; }
  .member .rm { grid-column: 1 / -1; justify-self: start; }
  .sb { grid-template-columns: 90px 1fr auto; }
  .macros { grid-template-columns: repeat(2, 1fr); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Cauldron</b><span>Daily meal planner</span></div>
    <span class="pill" id="countdown" hidden></span>
    <span class="pill" id="budgetPill"></span>
    <span class="pill" id="syncPill" title="Where your plan is saved"><span class="dot warn"></span>This device</span>
  </div>
  <div class="wrap">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="today" id="tab-today">Daily</button>
      <button class="tab" role="tab" data-tab="week" id="tab-week">Week</button>
      <button class="tab" role="tab" data-tab="groceries" id="tab-groceries">Groceries</button>
      <button class="tab" role="tab" data-tab="recipes" id="tab-recipes">Recipes</button>
      <button class="tab" role="tab" data-tab="setup" id="tab-setup">Household</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<button class="btn primary fab" id="fab" data-act="tweak">Tweak plan</button>
<dialog id="modal"><div class="mbody" id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- recipe library ----------
   [id, name, emoji, meals(b/l/d/s), tags, kcal, protein, carbs, fat, cost/serving GBP, minutes, ingredients per serving, steps]
   ingredient: [name, qty, unit, aisle]  aisle: P produce, M meat & seafood, D dairy & refrigerated, B bakery & grains,
   C tins & dry goods, F frozen, S cupboard staples & spices, N nuts & snacks */
const AISLES = { P: "Fruit & Veg", M: "Meat & Fish", D: "Dairy, Eggs & Chilled", B: "Bakery", C: "Tins, Jars & Dry Goods", F: "Frozen", N: "Nuts, Seeds & Snacks", S: "Cupboard Staples & Spices" };

/* ---------- planning ---------- */
function rank(dayIdx, slot, rnd, plan) {

const COUNT = ["each", "tin", "slice", "bunch", "clove", "stick", "rasher"];
const PLURAL = { tin: "tins", slice: "slices", bunch: "bunches", clove: "cloves", stick: "sticks", rasher: "rashers" };
function frac(q) {
  const w = Math.floor(q + 1e-9), f = Math.round((q - w) * 4) / 4;
  const g = { 0: "", .25: "¼", .5: "½", .75: "¾", 1: "" }[f];

}

    const step = buy ? (q < 100 ? 5 : q < 400 ? 10 : 50) : (q < 20 ? 1 : 5);
    return Math.max(step, Math.ceil(q / step - .01) * step) + " " + unit;
  }

function calcKcal(sex, age, kg, cm, act, goal) {
  if (age < 18) { const t = age < 4 ? 1100 : age < 9 ? 1500 : age < 14 ? (sex === "m" ? 2000 : 1800) : (sex === "m" ? 2600 : 2000); return Math.round((t * act / 1.375) / 50) * 50; }
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (sex === "m" ? 5 : -161);
  return Math.round((bmr * act + goal) / 50) * 50;
}

/* ---------- AI conjure ---------- */
async function conjure(slot, text) {
  if (!sampler || conjuring) return;
  conjuring = true; render();
  const target = Math.round(avgKcal() * (state.snacks ? SHARE4 : SHARE3)[slot] || 300);
  const maxCost = Math.max(.8, (dayBudget() / (householdKcal() / 1000) / bestIdx()) * target / 1000 * 1.3).toFixed(2);
  const restr = state.restrict.map(r => TAGLABEL[r]).join(", ") || "none";
  const styles = state.styles.map(s => TAGLABEL[s]).join(", ") || "none";
  const prompt = `You are a recipe developer for a home meal planner. Write ONE original ${SLOT[slot].toLowerCase()} recipe.
Strict dietary restrictions (must be followed exactly): ${restr}.
Preferred styles: ${styles}.
Never use these ingredients: ${state.avoid || "none"}.
The cook asked for: "${text || "surprise me"}".
Aim for about ${target} kcal per serving and at most £${maxCost} per serving at typical UK supermarket prices (Tesco, Sainsbury's, Aldi). Use ingredients any UK supermarket stocks, British names (courgette, coriander, mince, tinned, plain flour), metric amounts, and oven temperatures in °C with the fan temperature in brackets.
Reply with JSON only, no prose, in exactly this shape:
{"name":"string, max 40 chars","emoji":"one food emoji","time":minutes as integer,"kcal":integer per serving,"protein":grams integer,"carbs":grams integer,"fat":grams integer,"cost":GBP per serving as number,
"tags":["any that truly apply from: vegan, vegetarian, pescatarian, gf, df, keto, healthy, mediterranean, highprotein, budget, comfort, mexican, asian, halloween"],
"ingredients":[{"name":"lowercase grocery item","qty":number for ONE serving,"unit":"g|ml|each|tbsp|tsp|tin|slice|clove|bunch|stick|rasher","aisle":"Fruit & Veg|Meat & Fish|Dairy, Eggs & Chilled|Bakery|Tins, Jars & Dry Goods|Frozen|Nuts, Seeds & Snacks|Cupboard Staples & Spices"}],
"steps":["3 to 6 short imperative steps"]}`;
  try {
    const j = await sampler.json(prompt, { modelTier: "default" });
    const aisleCode = Object.fromEntries(Object.entries(AISLES).map(([c, n]) => [n.toLowerCase(), c]));
    const okTags = new Set([...RESTRICT, ...STYLES].map(x => x[0]));
    const num = (v, d) => (Number.isFinite(+v) && +v > 0 ? +v : d);
    const ing = (Array.isArray(j.ingredients) ? j.ingredients : []).slice(0, 20).map(i => [String(i.name || "ingredient").slice(0, 50), num(i.qty, 1), COUNT.concat(["g", "ml", "tbsp", "tsp"]).includes(i.unit) ? i.unit : "each", aisleCode[String(i.aisle || "").toLowerCase()] || "C"]);
    if (!j.name || !ing.length) throw { message: "The recipe came back incomplete. Try again." };
    const tags = [...new Set([...(Array.isArray(j.tags) ? j.tags : []).filter(t => okTags.has(t) && t !== "quick"), ...state.restrict, "custom"])];
    const r = { id: "ai_" + Date.now().toString(36), name: String(j.name).slice(0, 60), emoji: [...String(j.emoji || "🍲")].slice(0, 2).join(""), meals: slot[0], tags,
      kcal: Math.round(num(j.kcal, target)), protein: Math.round(num(j.protein, 15)), carbs: Math.round(num(j.carbs, 30)), fat: Math.round(num(j.fat, 10)), cost: Math.round(num(j.cost, 2) * 100) / 100,
      time: Math.round(num(j.time, 30)), ing, steps: (Array.isArray(j.steps) ? j.steps : []).slice(0, 8).map(s => String(s).slice(0, 300)) };
    state.custom = [r, ...state.custom].slice(0, 40);
    conjureResult = r;
    save();
    toast("Recipe conjured and saved");
  } catch (e) {
    if (e && e.code === "not_granted") { sampler = null; toast("AI recipes weren't allowed on this page."); }
    else if (e && e.code === "rate_limited") toast("Too many requests. Wait a minute and try again.");
    else toast((e && e.message) || "Couldn't conjure a recipe. Try again.");
  }
  conjuring = false; render();
  if (conjureResult) document.getElementById("conjure")?.scrollIntoView({ block: "nearest" });
}

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }
function markEdited() { state.example = false; if (state.plan.length) state.dirty = true; }

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const v = a.dataset.v, s = a.dataset.s;
  switch (a.dataset.act) {
    case "tab": state.tab = v; save(); render(); window.scrollTo(0, 0); break;
    case "day": state.day = +v; save(); render(); break;
    case "gotoDay": state.day = +v; state.tab = "today"; save(); render(); window.scrollTo(0, 0); break;
    case "generate": generate(true); render(); toast("Plan brewed"); break;
    case "fromToday": state.start = todayISO(); generate(false); render(); break;
    case "swap": swapMeal(state.day, s); break;
    case "lock": { const m = state.plan[state.day].meals[s]; if (m) { m.locked = !m.locked; save(); render(); } break; }
    case "open": { const dd = a.dataset.day != null ? +a.dataset.day : null; showModal(() => openRecipe(v, dd, s)); break; }
    case "close": document.getElementById("modal").close(); break;
    case "tweak": if (state.tab === "setup") { window.scrollTo(0, 0); break; } openCalc = null; showModal(openTweak); break;
    case "apply": generate(true); document.getElementById("modal").close(); render(); toast("Plan rebuilt"); break;
    case "choose": picker = { q: "", any: false, d: state.day, s }; showModal(openPicker); break;
    case "pick": setMeal(picker.d, picker.s, v); state.day = picker.d; document.getElementById("modal").close(); render(); toast(`${byId(v).name} chosen and locked`); break;
    case "peek": showModal(() => openRecipe(v, picker.d, picker.s, true)); break;
    case "pickerBack": showModal(openPicker); break;
    case "eat": { const m = state.plan[state.day].meals[s]; if (!m) break; const out = new Set(m.out || []); out.has(v) ? out.delete(v) : out.add(v); m.out = [...out]; save(); render(); break; }
    case "fav": { const i = state.fav.indexOf(v); i < 0 ? state.fav.push(v) : state.fav.splice(i, 1); save(); render(); toast(i < 0 ? "Added to favourites. It'll come up more often." : "Removed from favourites"); break; }
    case "ban": { const i = state.ban.indexOf(v); if (i < 0) { state.ban.push(v); const n = replaceEverywhere(v); toast(n ? `Won't suggest it again. Replaced in ${n} meal${n === 1 ? "" : "s"}.` : "Won't suggest it again"); } else { state.ban.splice(i, 1); toast("Allowed again"); } save(); render(); break; }
    case "kcalStep": { const m = state.members.find(x => x.id === v); if (m) { m.kcal = clamp((+m.kcal || 2000) + +a.dataset.d, 800, 5000); markEdited(); save(); render(); } break; }
    case "budgetStep": state.budget = clamp(state.budget + +a.dataset.d, 20, 5000); markEdited(); save(); render(); break;
    case "rfav": recipeFilter.fav = !recipeFilter.fav; render(); break;
    case "rmeal": recipeFilter.meal = v; render(); break;
    case "conjureFor": document.getElementById("modal").close(); state.tab = "recipes"; render(); window.scrollTo(0, 0); document.getElementById("cj-text")?.focus(); break;
    case "delCustom": state.custom = state.custom.filter(r => r.id !== v); state.fav = state.fav.filter(x => x !== v); state.plan.forEach(d => slots().forEach(sl => { if (d.meals[sl] && d.meals[sl].id === v) d.meals[sl] = null; })); if (conjureResult && conjureResult.id === v) conjureResult = null; save(); document.getElementById("modal").close(); render(); break;
    case "calc": openCalc = openCalc === v ? null : v; render(); break;
    case "addMember": state.members.push({ id: "m" + Date.now().toString(36), name: "Person " + (state.members.length + 1), kcal: 2000, avoid: "" }); markEdited(); save(); render(); break;
    case "rmMember": state.members = state.members.filter(m => m.id !== v); markEdited(); save(); render(); break;
    case "copyList": copyList(); break;
    case "clearChecks": state.checked = {}; save(); render(); break;
    case "reset": if (a.dataset.confirm) { const keepCustom = state.custom; state = defaultState(); state.custom = keepCustom; state.example = false; generate(false); render(); toast("Fresh start"); } else { a.dataset.confirm = "1"; a.textContent = "Tap again to erase settings"; } break;
  }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("h3[data-act]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check) { state.checked[t.dataset.check] = t.checked; if (!t.checked) delete state.checked[t.dataset.check]; save(); render(); return; }
  if (t.id === "rmatch") { recipeFilter.match = t.checked; render(); return; }
  if (t.id === "pk-any") { picker.any = t.checked; refreshModal(); return; }
  if (t.dataset.member) { const m = state.members.find(x => x.id === t.dataset.member); if (!m) return; const f = t.dataset.f; m[f] = f === "kcal" ? clamp(+t.value || 2000, 800, 5000) : f === "name" ? t.value.trim() || "Someone" : t.value.trim(); markEdited(); save(); render(); return; }
  if (t.dataset.list) { const L = state[t.dataset.list]; const i = L.indexOf(t.value); if (t.checked && i < 0) L.push(t.value); if (!t.checked && i >= 0) L.splice(i, 1); markEdited(); save(); render(); return; }
  if (t.dataset.store) { const L = state.storesOn, i = L.indexOf(t.dataset.store); if (t.checked && i < 0) L.push(t.dataset.store); if (!t.checked && i >= 0) L.splice(i, 1); state.example = false; save(); render(); return; }
  if (t.dataset.storeidx) { const id = t.dataset.storeidx, val = clamp(+t.value || 1, .5, 2); const c = state.customStores.find(x => x.id === id); if (c) c.idx = val; else state.storeIdx[id] = val; state.example = false; save(); render(); return; }
  if (t.dataset.bind) {
    const key = t.dataset.bind;
    if (key === "hidePantry") { state.hidePantry = t.checked; save(); render(); return; }
    if (key === "snacks") state.snacks = t.checked;
    else if (key === "budget") state.budget = clamp(+t.value || 100, 20, 5000);
    else if (key === "days") state.days = clamp(Math.round(+t.value) || 7, 1, 31);
    else if (key === "start") { if (!t.value) return; state.start = t.value; }
    else state[key] = t.value;
    markEdited(); save(); render();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "pk-q") { picker.q = e.target.value; const pos = e.target.selectionStart; openPicker(); const q = document.getElementById("pk-q"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.id === "rq") { recipeFilter.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("rq"); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const type = f.dataset.form;
  if (type === "conjure") conjure(document.getElementById("cj-slot").value, document.getElementById("cj-text").value.trim());
  if (type === "calc") {
    const val = id => document.getElementById(id).value;
    const kc = calcKcal(val("c-sex"), +val("c-age"), +val("c-wt"), +val("c-ht"), +val("c-act"), +val("c-goal"));
    const m = state.members.find(x => x.id === f.dataset.v); if (m) m.kcal = clamp(kc, 800, 5000);
    openCalc = null; markEdited(); save(); render(); toast(`Set to ${k(kc)} kcal/day`);
  }
  if (type === "addStore") {
    const name = document.getElementById("ns-name").value.trim(); if (!name) return;
    const id = "c" + Date.now().toString(36);
    state.customStores.push({ id, name: name.slice(0, 30), idx: clamp(+document.getElementById("ns-idx").value || 1, .5, 2) });
    state.storesOn.push(id); state.example = false; save(); render();
  }
  if (type === "addToPlan") {
    const d = +document.getElementById("ap-day").value, s = document.getElementById("ap-slot").value;
    setMeal(d, s, f.dataset.v);
    state.day = d; document.getElementById("modal").close(); render();
    toast(`Added to Day ${d + 1} ${SLOT[s].toLowerCase()} and locked`);
  }
});
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") e.target.close(); });
document.getElementById("modal").addEventListener("close", () => { modalView = null; });

function copyList() {
  let items = groceryList(); if (state.hidePantry) items = items.filter(i => i.aisle !== "S");
  const text = Object.keys(AISLES).map(a => { const l = items.filter(i => i.aisle === a && !state.checked[i.key]); return l.length ? AISLES[a].toUpperCase() + "\n" + l.map(i => `- ${i.name}: ${fmtQty(i.qty, i.unit, true)}`).join("\n") : ""; }).filter(Boolean).join("\n\n");
  const done = () => toast("Shopping list copied");
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text)); } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  modalView = null;
  document.getElementById("modalBody").innerHTML = `<div class="mhead"><h2 class="grow">Shopping list</h2><button class="btn sm ghost" data-act="close">Close</button></div><span class="sub">Select all and copy.</span><textarea id="copybox" rows="16" readonly>${esc(text)}</textarea>`;
  const dlg = document.getElementById("modal"); if (!dlg.open) dlg.showModal();
  const box = document.getElementById("copybox"); box.focus(); box.select();
}

if (!state.plan.length) { const fresh = !state.updatedAt; generate(false); if (fresh) state.updatedAt = 0; }
render();
setSync("local");
initRuntime();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
